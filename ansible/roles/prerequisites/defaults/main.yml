bashrc_aliases:
  - { guard: "alias steam_games=", line: "alias steam_games='xdg-open \"$HOME/.steam/debian-installation/steamapps/\"'" }
  - { guard: "alias maj=", line: "alias maj='sudo apt update && sudo apt upgrade -y'" }
  - { guard: "alias update=", line: "alias update='sudo apt update && sudo apt upgrade -y'" }
  - { guard: "alias python=", line: "alias python=python3" }
  - { guard: "alias k=", line: 'alias k="kubectl"' }
  - { guard: "alias wallpp=", line: 'alias wallpp="reset_wallpp"' }

bashrc_functions:
  - name: reset_wallpp
    content: |
      reset_wallpp() {
          pkill -f '[z]_wallpapers-changer.sh'
          sleep 1
          nohup /bin/bash /home/psowl/work/ansible_install_mint/z_wallpapers-changer.sh >/dev/null 2>&1 &
          echo "Wallpaper changer restarted (PID: $!)"
      }

network_target_speed: 2500

terminal_cols: 150
terminal_rows: 30

base_packages:
  - vim
  - curl
  - htop
  - tree
  - build-essential
  - git
  - wget
  - python3-pip
  - python3-venv
  - feh
  - unrar
  - flatpak
  - gnome-software-plugin-flatpak
